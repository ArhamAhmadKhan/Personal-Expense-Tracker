
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction | ExpenseTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="main-content">

    <section class="panel add-transaction">
        <h1>Edit Transaction</h1>
        <p class="subtitle">Update your transaction details</p>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Category</label>
                    <select name="category_id" required>
                        {% for category in categories %}
                            {% if category.type == 'income' or category.type == 'expense' %}
                            <option value="{{ category.category_id }}"
                                {% if category.category_id == transaction.category_id %}
                                selected
                                {% endif %}>
                                {{ category.category_name }} ({{ category.type }})
                            </option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" name="amount"
                           value="{{ transaction.amount }}"
                           min="0.01" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="transaction_date"
                           value="{{ transaction.transaction_date }}"
                           required>
                </div>

                <div class="form-group full-width">
                    <label>Description</label>
                    <input type="text" name="description"
                           value="{{ transaction.description or '' }}">
                </div>

            </div>

            <button type="submit" class="add-button">
                Save Changes
            </button>

            <a href="{{ url_for('home') }}">Cancel</a>

        </form>
    </section>

</main>

</body>
</html>
